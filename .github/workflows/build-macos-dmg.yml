name: Build macOS DMG

# Builds DeskCanvas into a macOS .app on a GitHub macOS runner and
# packages it as a drag-to-Applications DMG. The app is unsigned
# (self-use project): first launch needs right-click -> Open.
#
# Release flow: pushing a version tag (v*) builds with that version
# injected into the binary (-X main.Version) and publishes a GitHub
# Release with the DMG attached — that Release is what the in-app
# auto-updater checks, downloads, verifies and installs.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: m0-prototype/go.mod

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build the app
        working-directory: m0-prototype
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          if [ -n "$VERSION" ]; then
            wails build -clean -platform darwin/arm64 -ldflags "-X main.Version=$VERSION"
          else
            wails build -clean -platform darwin/arm64
          fi

      - name: Verify the app bundle
        working-directory: m0-prototype
        run: |
          APP="$(ls -d build/bin/*.app)"
          echo "App: $APP"
          ls -la "$APP/Contents/MacOS/"
          file "$APP/Contents/MacOS/"*

      - name: Package DMG
        working-directory: m0-prototype
        run: |
          APP="$(ls -d build/bin/*.app)"
          mkdir -p dist/dmg
          cp -R "$APP" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "DeskCanvas" -srcfolder dist/dmg \
            -ov -format UDZO dist/DeskCanvas-M0-macOS-arm64.dmg
          ls -la dist/
          shasum -a 256 dist/DeskCanvas-M0-macOS-arm64.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskcanvas-dmg
          path: m0-prototype/dist/DeskCanvas-M0-macOS-arm64.dmg
          if-no-files-found: error

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: m0-prototype
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/DeskCanvas-M0-macOS-arm64.dmg --clobber
          else
            gh release create "$VERSION" dist/DeskCanvas-M0-macOS-arm64.dmg \
              --title "DeskCanvas $VERSION" \
              --notes "DeskCanvas $VERSION — macOS arm64 DMG（未签名，首次启动右键「打开」）。应用内自动更新会检查、下载并校验此 Release 的 DMG 后自动安装。SHA-256 见资产 digest。" \
              --prerelease
          fi
